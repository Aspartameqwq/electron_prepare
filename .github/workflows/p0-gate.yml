name: p0-gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# P0 最小治理门禁：不构建 CCS、不烧录、不做硬件测试。
jobs:
  governance:
    name: governance (manifest/docs/links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Manifest + absolute-path gate
        run: python scripts/validate_reference_manifest.py
      - name: Doc consistency (v7.2 / six states / skill optional)
        run: python scripts/check_doc_consistency.py
      - name: Markdown local links
        run: python scripts/check_markdown_links.py

  host-tests:
    name: host tests (clang C11 -Werror)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM (clang)
        shell: pwsh
        run: choco install llvm -y --no-progress
      - name: Run host tests
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/test_host.ps1
